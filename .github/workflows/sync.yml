name: Sync fork with upstream

on:
  schedule:
    - cron: '0 0 * * *'   # 每天 UTC 0 点（北京时间 8 点）执行
  workflow_dispatch:       # 允许在 Actions 页面手动触发

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check SYNC_TOKEN secret
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          if [ -z "$SYNC_TOKEN" ]; then
            echo "::error::Missing repository secret SYNC_TOKEN. Add a classic PAT with repo + workflow scope, or a fine-grained token with Contents (read/write) and Workflows (read/write) for this repository."
            exit 1
          fi
      - name: Sync from upstream
        run: gh repo sync ${{ github.repository }} -b main
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
